name: Reusable Agent Planner

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      issue_title:
        required: true
        type: string
      issue_body:
        required: false
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Agentic Planning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_BODY: ${{ inputs.issue_body }}
          CLAUDE_CODE_NO_FLICKER: 1
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Error: ANTHROPIC_API_KEY is empty."
            exit 1
          fi
          PLAN=$(npx @anthropic-ai/claude-code --bare -p "Analyze this issue: '$ISSUE_TITLE'. Content: '$ISSUE_BODY'. Propose a concise implementation plan. Mention that the user should reply with '@agent execute' to start." --allowedTools "Read")
          gh issue comment ${{ inputs.issue_number }} --body "🤖 **Agent Planner:** $PLAN"
