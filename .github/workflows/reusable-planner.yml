name: Reusable Agent Planner

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      issue_title:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Cache Claude Binary
        id: cache-claude
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/claude
          key: ${{ runner.os }}-claude-binary

      - name: Install Claude Code
        run: |
          if [ ! -f "$HOME/.local/bin/claude" ]; then
            curl -fsSL https://claude.ai/install.sh | bash
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Agentic Planning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          CLAUDE_CODE_NO_FLICKER: 1
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Error: ANTHROPIC_API_KEY is empty."
            exit 1
          fi
          
          # Fetch full issue data robustly via CLI
          ISSUE_DATA=$(gh issue view ${{ inputs.issue_number }} --json body,comments)
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
          
          # Get the latest human comment (excluding bot comments)
          LATEST_COMMENT=$(echo "$ISSUE_DATA" | jq -r '.comments | map(select(.author.login != "github-actions")) | last | .body // ""')
          
          PROMPT="Analyze this issue: '$ISSUE_TITLE'. Original Content: '$ISSUE_BODY'."
          if [ -n "$LATEST_COMMENT" ] && [ "$LATEST_COMMENT" != "null" ]; then
            PROMPT="$PROMPT The user has provided additional feedback: '$LATEST_COMMENT'. Please refine or update the implementation plan based on this feedback."
          else
            PROMPT="$PROMPT Propose a concise implementation plan."
          fi
          PROMPT="$PROMPT Mention that the user should reply with '@agent execute' to start, or provide further feedback to iterate on this plan."
          
          PLAN=$(claude --bare -p "$PROMPT" --allowedTools "Read")
          gh issue comment ${{ inputs.issue_number }} --body "🤖 **Agent Planner:** $PLAN"
