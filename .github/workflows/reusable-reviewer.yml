name: Reusable Agent Reviewer

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: string
      pull_request_title:
        required: true
        type: string
      comment_body:
        required: true
        type: string
      head_ref:
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve Head Ref
        id: resolve-ref
        run: |
          echo "Context: PR #${{ inputs.pull_request_number }}"
          if [ -n "${{ inputs.head_ref }}" ]; then
            echo "ref=${{ inputs.head_ref }}" >> $GITHUB_OUTPUT
            echo "Using provided ref: ${{ inputs.head_ref }}"
          else
            echo "Fetching head ref for PR #${{ inputs.pull_request_number }}..."
            # Strip quotes from pull_request_number if they were added by toJSON()
            CLEAN_PR_NUMBER=$(echo "${{ inputs.pull_request_number }}" | sed 's/"//g')
            HEAD_REF=$(gh pr view "$CLEAN_PR_NUMBER" --json headRefName -q .headRefName)
            echo "ref=$HEAD_REF" >> $GITHUB_OUTPUT
            echo "Resolved head ref: $HEAD_REF"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: steps.resolve-ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          fetch-depth: 0

      - name: Cache Claude Binary
        id: cache-claude
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/claude
          key: ${{ runner.os }}-claude-binary

      - name: Install Claude Code
        run: |
          if [ ! -f "$HOME/.local/bin/claude" ]; then
            curl -fsSL https://claude.ai/install.sh | bash
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Agent Re-evaluate
        run: |
          echo "Agent addressing review comments..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          claude --bare -p "Address the feedback in this PR review comment: '${{ inputs.comment_body }}'. The comment is on a PR that implements '${{ inputs.pull_request_title }}'. Use available tools to fix the code and tests." --allowedTools "Bash,Edit,Read"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "fix: Address agent review feedback"
            git push origin ${{ steps.resolve-ref.outputs.ref }}
            gh pr comment ${{ inputs.pull_request_number }} --body "🤖 **Agent Reviewer:** I have pushed a new commit to address your feedback."
          else
            echo "No changes to commit."
            gh pr comment ${{ inputs.pull_request_number }} --body "🤖 **Agent Reviewer:** I analyzed your feedback but no code changes were needed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_NO_FLICKER: 1
